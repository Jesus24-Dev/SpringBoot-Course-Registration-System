<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h2>Register</h2>
        <form th:action="@{/register}" th:method="POST" th:object="${user}">
            <div>
                <label>Username</label>
                <input type="text" name="username" id="username" th:field="*{username}">
                <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </div>
            <div>
                <label>Password</label>
                <input type="password" name="password" id="password" th:field="*{password}">
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
            <div>
                <label>Role</label>
                <span th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}"></span>
                <select th:field="*{roles}">
                    <option value="">Select an option...</option>
                    <option value="ROLE_ADMIN" th:text="ADMIN"></option>
                    <option value="ROLE_USER" th:text="USER"></option>
                </select>
            </div>
            <button type="submit">Register</button>
        </form>
        <a th:href="@{/login}">I have an account</a>
    </body>
</html>
